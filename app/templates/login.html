{% extends "auth_base.html" %}
{% block title %}Sign in{% endblock %}
{% block auth %}
{% if message %}<div class="alert alert-info">{{ message }}</div>{% endif %}
{% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/login">
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required value="{{ email or '' }}"></div>
  <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn btn-primary btn-block" type="submit">Sign in</button>
</form>
<p class="small" style="text-align:center;margin-top:16px"><a href="/forgot-password">Forgot password?</a> · <a href="/signup">Create an account</a></p>
{% endblock %}
