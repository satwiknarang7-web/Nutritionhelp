{% extends "auth_base.html" %}
{% block title %}Create account{% endblock %}
{% block auth %}
{% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/signup">
  <div class="field"><label for="display_name">Name</label><input id="display_name" name="display_name" autocomplete="name" value="{{ display_name or '' }}"></div>
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required value="{{ email or '' }}"></div>
  <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><div class="small muted">At least 8 characters.</div></div>
  <button class="btn btn-primary btn-block" type="submit">Create account</button>
</form>
<p class="small" style="text-align:center;margin-top:16px">Already have an account? <a href="/login">Sign in</a></p>
{% endblock %}
