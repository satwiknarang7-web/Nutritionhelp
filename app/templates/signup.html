{% extends "auth_base.html" %}
{% block title %}Create account{% endblock %}
{% block auth %}
<h2 class="auth-title">Start eating smarter 🌱</h2>
<p class="sub">Free forever. Takes 30 seconds.</p>
{% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/signup">
  <div class="field"><label for="display_name">Your name</label><input id="display_name" name="display_name" autocomplete="name" value="{{ display_name or '' }}" placeholder="Asha"></div>
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required value="{{ email or '' }}" placeholder="you@example.com"></div>
  <div class="field"><label for="password">Password</label>
    <div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    <button type="button" class="icon-btn" data-toggle-pw aria-label="Show password">👁️</button></div>
    <div class="bar" style="margin-top:8px" aria-hidden="true"><span id="pw-meter" style="width:0"></span></div>
    <div class="tiny faint" id="pw-hint" style="margin-top:4px">At least 8 characters.</div></div>
  <button class="btn btn-primary btn-block" type="submit">Create account</button>
</form>
<p class="small" style="text-align:center;margin-top:18px">Already have an account? <a href="/login">Sign in</a></p>
{% endblock %}
{% block scripts %}<script src="/static/js/auth.js?v=2"></script>{% endblock %}
